<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>한-베 달력 · PC Push 테스트</title>
<style>
body{font-family:system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 20px;line-height:1.5}button{padding:12px 16px;margin:6px 4px 6px 0;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:700}textarea,input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:8px;margin:6px 0 12px}small{color:#666}.box{border:1px solid #ddd;border-radius:14px;padding:18px;margin:16px 0}.ok{color:green}.err{color:#b00020}
</style>
</head>
<body>
<h1>📲 PC → iPhone Push 테스트</h1>
<p>iPhone에서 Push 구독 정보를 만든 뒤 PC에서 이 페이지를 열어 Push를 보냅니다.</p>

<div class="box">
<h2>① iPhone에서 준비</h2>
<button id="subscribe">iPhone Push 구독 만들기</button>
<textarea id="subscription" rows="8" placeholder="iPhone에서 생성된 subscription JSON이 여기에 표시됩니다."></textarea>
<button id="copy">구독 정보 복사</button>
<small>복사한 내용을 PC의 같은 페이지에 붙여넣으세요. 구독 정보에는 Push endpoint가 포함되므로 공개 게시하지 마세요.</small>
</div>

<div class="box">
<h2>② PC에서 Push 보내기</h2>
<textarea id="paste" rows="8" placeholder="iPhone에서 복사한 subscription JSON을 붙여넣으세요."></textarea>
<input id="server" value="https://holiday-calendar-push-server.vercel.app" aria-label="Push server">
<button id="send">💊 iPhone으로 Push 보내기</button>
<p id="status"></p>
</div>

<script>
const SERVER="https://holiday-calendar-push-server.vercel.app";
const $=id=>document.getElementById(id);
let registration;
function setStatus(t,ok=false){$("status").textContent=t;$("status").className=ok?"ok":"err";}
function b64ToBytes(s){const p="=".repeat((4-s.length%4)%4),r=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)));}
async function getRegistration(){
  if(!("serviceWorker" in navigator))throw Error("Service Worker를 지원하지 않는 브라우저입니다.");
  registration=registration||await navigator.serviceWorker.register("./sw.js");
  return registration;
}
$("subscribe").onclick=async()=>{
  try{
    if(!("Notification" in window)||!("PushManager" in window))throw Error("이 브라우저는 Web Push를 지원하지 않습니다.");
    const permission=Notification.permission==="granted"?"granted":await Notification.requestPermission();
    if(permission!=="granted")throw Error("알림 권한을 허용해주세요.");
    const reg=await getRegistration();
    const cfg=await (await fetch(SERVER+"/api/config")).json();
    if(!cfg.publicKey)throw Error(cfg.error||"VAPID 공개키를 받지 못했습니다.");
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToBytes(cfg.publicKey)});
    $("subscription").value=JSON.stringify(sub.toJSON());
    setStatus("✓ iPhone Push 구독 생성 완료. 내용을 복사해서 PC로 옮기세요.",true);
  }catch(e){setStatus("❌ "+e.message);}
};
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText($("subscription").value);setStatus("✓ 복사했습니다. PC에서 붙여넣으세요.",true);}catch(e){setStatus("복사 실패: 내용을 길게 눌러 직접 복사하세요.");}};
$("send").onclick=async()=>{
  try{
    const sub=JSON.parse($("paste").value);
    const base=$("server").value.replace(/\/$/,"");
    const r=await fetch(base+"/api/send-test-push",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({subscription:sub,title:"💊 약먹기 Push 테스트",body:"앱을 닫은 상태에서도 Push가 도착했습니다."})});
    const d=await r.json();
    if(!r.ok)throw Error(d.error||"Push 전송 실패");
    setStatus("✓ Push 전송 요청 완료. iPhone 알림을 확인하세요.",true);
  }catch(e){setStatus("❌ "+e.message);}
};
</script>
</body>
</html>
